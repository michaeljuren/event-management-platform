name: CI

# Build the solution and run every unit test on each push, on pull requests into main,
# and on demand from the Actions tab.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Verify EF Core migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.13
          dotnet ef migrations has-pending-model-changes --project src/RaceDay.Api --no-build --configuration Release

      - name: Run unit tests
        run: >
          dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
